# Camera list for camera_subscriber.py (API -> ROS). Each entry is one
# camera stream:
#
#   id:     logical name, matched against the incoming API event's
#           "camera_id" field (see send_cameras.yaml, which tags outgoing
#           frames with this same id) to route it to the right topic.
#   topic:  topic camera_subscriber.py republishes that camera's frames
#           to. Must end in exactly "/compressed" for image_transport
#           tools (rqt_image_view, etc.) to recognize it, and must differ
#           from the matching entry's topic in send_cameras.yaml to avoid
#           a publish/subscribe loop between the two nodes.
#
# Add one entry per physical camera below, matching the ids in
# send_cameras.yaml.

cameras:
  - id: zed_right
    topic: /zed_api/zed_node/right/color/rect/image/compressed

  # - id: zed_left
  #   topic: /zed_api/zed_node/left/color/rect/image/compressed

  # - id: wrist_right
  #   topic: /right_api/camera/color/image_raw/compressed

  # - id: wrist_left
  #   topic: /left_api/camera/color/image_raw/compressed
