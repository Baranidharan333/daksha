<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Plot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='plot.css') }}">
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Topic Plot</h1>
    <div class="subtitle">Live topic/field values - browser rqt_plot</div>
  </div>

  <div class="panel">
    <div id="legend" class="legend-row"></div>

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
      <div id="tooltip" class="chart-tooltip" hidden></div>
    </div>

    <div class="chart-controls">
      <label class="checkbox-label">
        <input type="checkbox" id="table-toggle"> Table view
      </label>
      <span class="spacer"></span>
      <span id="window-label" class="duration-label"></span>
    </div>

    <table id="value-table" hidden>
      <thead>
        <tr><th>Path</th><th>Topic</th><th>Value</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script src="{{ url_for('static', filename='plot.js') }}"></script>
</body>
</html>
