# Camera list for camera_publisher.py (ROS -> API). Each entry is one
# camera stream:
#
#   id:     logical name, tags the outgoing API payload's "camera_id"
#           field so camera_subscriber.py (see receive_cameras.yaml) can
#           route frames back to the matching topic.
#   topic:  local topic camera_publisher.py subscribes to. Must already
#           carry sensor_msgs/CompressedImage (e.g. from a camera driver
#           or image_transport republish).
#
# Add one entry per physical camera below.

cameras:
  - id: zed_right
    topic: /zed/zed_node/right/color/rect/image/compressed

  # - id: zed_left
  #   topic: /zed/zed_node/left/color/rect/image/compressed

  # - id: wrist_right
  #   topic: /right/camera/color/image_raw/compressed

  # - id: wrist_left
  #   topic: /left/camera/color/image_raw/compressed
