# =========================================================
# GESTURE MANAGEMENT
# =========================================================
# ROS 2 parameters for the gesture_management node (see
# gesture_management/gesture_management_app.py -> GestureNode).
#
# ramp_velocity_rad_s and ramp_position_tolerance_deg are also
# changeable at runtime, either with `ros2 param set /gesture_management
# <name> <value>` or from the web UI's Config panel — both go through the
# same validated on-set-parameters callback.

gesture_management:
  ros__parameters:

    # Topics
    default_source_topic: "/joint_states"
    default_output_topic: "/joint_cmd"
    gesture_status_topic: "/gesture_status_topic"

    # Timing
    gesture_status_period_s: 0.25   # matches the UI's own /api/state poll rate
    settle_delay_s: 0.4             # let a fresh subscriber connect before streaming
    mode_settle_timeout_s: 6.0      # how long to wait for /mode_toggler/status to confirm

    # Pre-replay "move to start" ramp — before streaming a recorded
    # trajectory, each joint is walked to the recording's first-frame
    # position at a fixed, slow rate, then the arm's actual /joint_states
    # are checked against that target before playback starts.
    ramp_velocity_rad_s: 0.1        # per-joint speed while moving to the start pose
    ramp_velocity_min: 0.01         # safety bounds for the settable value above
    ramp_velocity_max: 1.0
    ramp_rate_hz: 50.0
    ramp_position_tolerance_deg: 11.46   # ~0.2 rad; how close counts as "arrived"
    ramp_position_tolerance_deg_min: 0.5
    ramp_position_tolerance_deg_max: 30.0
    ramp_move_timeout_s: 30.0
    ramp_feedback_timeout_s: 3.0    # how long to wait for live /joint_states
