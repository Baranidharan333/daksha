domain_id: 55
recording:
  domain_id: 55
  record_hz: 30.0
  episode_len: 500
  max_episodes: 1
  inter_episode_delay: 1.0
  fps: 30
  # Sign applied to the leader-right/leader-left gripper reading when
  # building the action vector's gripper channel. Has been observed to flip
  # between recording sessions (stable within a session) -- if a session's
  # action gripper channel moves opposite to observation.state's, flip the
  # matching value here (must be 1.0 or -1.0). See ros2_topic_recorder.py.
  leader_right_gripper_sign: -1.0
  leader_left_gripper_sign: -1.0
dataset:
  dataset_name: final_test
  task: pick_object
  prompt: Pick up the red block
  root_dir: /home/phy_ai/Desktop/dataset
topics:
  leader_topic_left: /leader/left_joint_states
  leader_topic_right: /leader/right_joint_states
  follower_topic_left: /LeftArmSystem_ordered_joint_states
  follower_topic_right: /RightArmSystem_ordered_joint_states
  follower_cmd_topic_left: /joint_cmd
  follower_cmd_topic_right: /joint_cmd
  # /joint_cmd's real subscriber (joint_command_limiter) is
  # sensor_msgs/msg/JointState -- confirmed via `ros2 topic info /joint_cmd
  # -v`, where every other live publisher on this topic
  # (joint_cmd_publisher_from_joint_sates_node, home_move_service,
  # daksha_dashboard) is also JointState. Float64MultiArray here silently
  # fails to match any subscriber (DDS won't connect endpoints with
  # different types), so replayed commands never reach the controller.
  follower_cmd_msg_type: joint_state
  leader_cmd_topic_left: ''
  leader_cmd_topic_right: ''
  camera_topics: &id001
    world: /world/camera/color/image_raw/compressed
recording_topics:
  leader_topic_left: /leader/left_joint_states
  leader_topic_right: /leader/right_joint_states
  follower_topic_left: /LeftArmSystem_ordered_joint_states
  follower_topic_right: /RightArmSystem_ordered_joint_states
  follower_cmd_topic_left: /joint_cmd
  follower_cmd_topic_right: /joint_cmd
  follower_cmd_msg_type: joint_state
  leader_cmd_topic_left: ''
  leader_cmd_topic_right: ''
  camera_topics: *id001
